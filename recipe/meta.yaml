{% set name = "pyelftools" %}
{% set version = "0.33" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pyelftools-{{ version }}.tar.gz
  sha256: 660d82dcbeb8e83d1702bd97f223f761625da06111c0cc988eac6b8ab0c1b61f

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python  {{ python_min }}
    - setuptools >=46.4.0
    - pip
  run:
    - python >={{ python_min }}
    # different packages because of python scripts
    - __unix    # [unix]
    - __win     # [win]

test:
  imports:
    - elftools
    - elftools.common
  commands:
    - pip check
  requires:
    - pip
    - python   {{ python_min }}

about:
  home: https://github.com/eliben/pyelftools
  summary: Library for analyzing ELF files and DWARF debugging information
  license: Unlicense
  license_file: LICENSE

extra:
  recipe-maintainers:
    - msarahan
    - ocefpaf
